# 1. Configuración del Servidor
server.port=8080

# 2. Datos de conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/db_renta_herramientas?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=keysher02

# 3. Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 4. Seguridad JWT
jwt.secret=UnaClaveMuySecretaYLoSuficientementeLargaParaQueFuncioneElAlgoritmoHS256
jwt.expiration=86400000

# 5. Configuración de Swagger (Opcional, para asegurar la ruta)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs